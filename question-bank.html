<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Mathcolate — Question Bank</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>.hidden{display:none!important} body{font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}</style>
</head>
<body class="min-h-screen bg-gray-50 text-gray-800">
<header class="sticky top-0 z-20 border-b border-[#f2e8e5] bg-white shadow-sm">
  <div class="mx-auto flex max-w-7xl items-center justify-between gap-3 px-4 py-4">
    <a href="index.html" class="text-xl font-extrabold tracking-tight text-[#5c3a18]">Mathcolate</a>
    <div class="flex items-center gap-3"><button id="lang-toggle" class="rounded-lg px-3 py-2 text-sm font-semibold text-gray-600 hover:bg-gray-100">中文/ENG</button><span id="user-label" class="text-sm text-gray-500"></span><a href="index.html" class="rounded-lg bg-[#f2e8e5] px-3 py-2 text-sm font-semibold text-[#5c3a18]" data-i18n="back">Back</a></div>
  </div>
</header>
<main class="mx-auto max-w-7xl space-y-6 px-4 py-8">
  <section class="flex flex-col justify-between gap-3 sm:flex-row sm:items-end">
    <div><p class="text-sm font-semibold uppercase tracking-wider text-[#8b5a2b]" data-i18n="eyebrow">Question Bank</p><h1 class="mt-1 text-3xl font-extrabold text-gray-900" id="page-title">Update Question Bank</h1><p class="mt-2 max-w-3xl text-sm text-gray-600" id="page-description"></p></div>
    <button id="new-question" class="hidden rounded-xl bg-[#6f4822] px-5 py-3 text-sm font-bold text-white shadow-sm hover:bg-[#5c3a18]" data-i18n="newQuestion">+ New question</button>
  </section>
  <div id="notice" class="hidden rounded-xl border p-4 text-sm" role="status" aria-live="polite"></div>
  <section id="editor-card" class="hidden rounded-2xl border border-[#f2e8e5] bg-white p-5 shadow-sm sm:p-7">
    <div class="mb-5 flex items-center justify-between gap-3"><div><h2 class="text-xl font-bold" id="editor-title"></h2><p class="mt-1 text-sm text-gray-500" data-i18n="bilingualHint">Complete both language versions. Mathematical expressions may use LaTeX.</p></div><button id="close-editor" class="rounded-lg px-3 py-2 text-gray-500 hover:bg-gray-100" aria-label="Close">✕</button></div>
    <form id="question-form" class="space-y-5">
      <input type="hidden" id="question-uuid">
      <div class="grid gap-4 md:grid-cols-3">
        <label class="block text-sm font-semibold"><span data-i18n="questionId">Question ID</span><input id="question-code" required maxlength="120" class="mt-1 w-full rounded-lg border border-gray-300 px-3 py-2.5 font-normal outline-none focus:border-[#8b5a2b]"></label>
        <label class="block text-sm font-semibold"><span data-i18n="topic">Topics (comma separated)</span><input id="question-topics" required class="mt-1 w-full rounded-lg border border-gray-300 px-3 py-2.5 font-normal outline-none focus:border-[#8b5a2b]"></label>
        <label class="block text-sm font-semibold"><span data-i18n="kind">Question type</span><select id="question-kind" class="mt-1 w-full rounded-lg border border-gray-300 bg-white px-3 py-2.5 font-normal"><option value="MC">MC — Multiple choice</option><option value="SQ">SQ — Short question</option></select></label>
      </div>
      <div class="grid gap-4 lg:grid-cols-2">
        <label class="block text-sm font-semibold"><span data-i18n="stemEn">Question (English)</span><textarea id="stem-en" required rows="4" class="mt-1 w-full rounded-lg border border-gray-300 px-3 py-2.5 font-normal" placeholder="Enter the English question. LaTeX may be included."></textarea></label>
        <label class="block text-sm font-semibold"><span data-i18n="stemZh">Question (Chinese)</span><textarea id="stem-zh" required rows="4" class="mt-1 w-full rounded-lg border border-gray-300 px-3 py-2.5 font-normal" placeholder="輸入中文題目，可包含 LaTeX。"></textarea></label>
      </div>
      <div id="mc-fields" class="space-y-3 rounded-xl bg-gray-50 p-4">
        <div class="flex flex-wrap items-center justify-between gap-2"><h3 class="font-bold" data-i18n="choices">Choices</h3><p class="text-xs text-gray-500" data-i18n="choicesHint">2–6 options; select every correct option.</p></div>
        <div id="choices-list" class="space-y-3"></div>
        <button type="button" id="add-choice" class="rounded-lg border border-gray-300 bg-white px-3 py-2 text-sm font-semibold hover:bg-gray-50" data-i18n="addChoice">+ Add choice</button>
      </div>
      <div id="sq-fields" class="hidden space-y-3 rounded-xl bg-gray-50 p-4">
        <h3 class="font-bold" data-i18n="subparts">Short-answer parts</h3>
        <p class="text-xs text-gray-500" data-i18n="subpartsHint">Each part has its own answer, explanation and integer marks.</p>
        <div id="subparts-list" class="space-y-3"></div>
        <button type="button" id="add-subpart" class="rounded-lg border border-gray-300 bg-white px-3 py-2 text-sm font-semibold hover:bg-gray-50" data-i18n="addSubpart">+ Add part</button>
      </div>
      <div class="grid gap-4 lg:grid-cols-2">
        <label class="block text-sm font-semibold"><span data-i18n="explanationEn">Explanation (English)</span><textarea id="explanation-en" rows="3" required class="mt-1 w-full rounded-lg border border-gray-300 px-3 py-2.5 font-normal"></textarea></label>
        <label class="block text-sm font-semibold"><span data-i18n="explanationZh">Explanation (Chinese)</span><textarea id="explanation-zh" rows="3" required class="mt-1 w-full rounded-lg border border-gray-300 px-3 py-2.5 font-normal"></textarea></label>
      </div>
      <div class="flex flex-col-reverse justify-end gap-3 border-t pt-5 sm:flex-row"><button type="button" id="cancel-editor" class="rounded-lg border border-gray-300 px-4 py-2.5 text-sm font-semibold" data-i18n="cancel">Cancel</button><button type="submit" id="save-question" class="rounded-lg bg-[#6f4822] px-5 py-2.5 text-sm font-bold text-white hover:bg-[#5c3a18]" data-i18n="submitQuestion">Submit question</button></div>
    </form>
  </section>
  <section class="rounded-2xl border border-gray-200 bg-white p-4 shadow-sm sm:p-6">
    <div class="mb-5 flex flex-col gap-3 md:flex-row md:items-center md:justify-between">
      <div><h2 class="text-xl font-bold" data-i18n="questionList">Questions</h2><p id="list-description" class="mt-1 text-sm text-gray-500"></p></div>
      <div class="flex flex-col gap-2 sm:flex-row"><input id="search" class="rounded-lg border border-gray-300 px-3 py-2 text-sm" placeholder="Search Question ID"><select id="state-filter" class="rounded-lg border border-gray-300 bg-white px-3 py-2 text-sm"><option value="all">All statuses</option><option value="pending">Pending review</option><option value="published">Published</option><option value="rejected">Rejected</option><option value="inactive">Inactive</option></select><select id="kind-filter" class="rounded-lg border border-gray-300 bg-white px-3 py-2 text-sm"><option value="all">All types</option><option value="MC">MC</option><option value="SQ">SQ</option></select><button id="refresh" class="rounded-lg border border-gray-300 px-3 py-2 text-sm font-semibold" data-i18n="refresh">Refresh</button></div>
    </div>
    <div id="loading" class="py-10 text-center text-sm text-gray-500"></div>
    <div id="empty" class="hidden rounded-xl border border-dashed border-gray-300 bg-gray-50 px-4 py-10 text-center"><p class="font-semibold text-gray-700" data-i18n="emptyTitle">No questions yet</p><p class="mt-2 text-sm text-gray-500" id="empty-description"></p></div>
    <div id="question-list" class="space-y-3"></div>
  </section>
</main>
<script>
(() => {
  const SUPABASE_URL = 'https://stguzuvmnfjxuygbuuij.supabase.co';
  // Public anon key is intentionally read from the existing project configuration pattern.
  const SUPABASE_ANON_KEY = 'REPLACE_WITH_EXISTING_PUBLIC_ANON_KEY';
  const db = window.supabase?.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  const $ = id => document.getElementById(id);
  let lang = (() => { try { return localStorage.getItem('mathcolate_language') || 'en'; } catch (_) { return 'en'; } })();
  let profile = null, isAdmin = false, editing = false, rows = [], choiceCount = 0, partCount = 0;
  const copy = {
    en: { back:'Back', eyebrow:'Question Bank', newQuestion:'+ New question', bilingualHint:'Complete both language versions. Mathematical expressions may use LaTeX.', questionId:'Question ID', topic:'Topics (comma separated)', kind:'Question type', stemEn:'Question (English)', stemZh:'Question (Chinese)', choices:'Choices', choicesHint:'2–6 options; select every correct option.', addChoice:'+ Add choice', subparts:'Short-answer parts', subpartsHint:'Each part has its own answer, explanation and integer marks.', addSubpart:'+ Add part', explanationEn:'Explanation (English)', explanationZh:'Explanation (Chinese)', cancel:'Cancel', submitQuestion:'Submit question', questionList:'Questions', refresh:'Refresh', emptyTitle:'No questions yet', search:'Search Question ID', all:'All statuses', pending:'Pending review', published:'Published', rejected:'Rejected', inactive:'Inactive', allTypes:'All types', teacherDescription:'Submit bilingual questions for administrator review. Your submissions remain private until approved.', adminDescription:'Create and maintain the central bilingual Question Bank. Review teacher submissions before publication.', listTeacher:'Your submissions', listAdmin:'Central Question Bank and teacher submissions', emptyTeacher:'No submissions yet. Use “New question” to submit the first one.', emptyAdmin:'The central Question Bank is empty. Add questions here or review teacher submissions.', loading:'Loading…', loadError:'Could not load questions. The Question Bank service may not be deployed yet.', authError:'Please sign in again from the Mathcolate homepage.', roleError:'This page is only available to teachers and administrators.', status_pending:'Pending review', status_published:'Published', status_rejected:'Rejected', status_inactive:'Inactive', review:'Review', edit:'Edit', approve:'Approve and publish', return:'Return for revision', reject:'Reject', reason:'Optional reason', confirm:'Confirm', noAnswer:'Each question must include a standard answer before publication.', missingChoice:'Add at least 2 choices and select at least one correct answer.', saved:'Question submitted.', actionFailed:'The operation failed. No success was assumed; please retry.', codeRequired:'Question ID is required.', topicsRequired:'Enter at least one topic.', newTitle:'Create question', editTitle:'Edit question', requestTitle:'Submit question for review', adminCreate:'Save as pending review', duplicate:'A question with this ID may already exist. The server will enforce the final uniqueness rule at publication.' },
    zh: { back:'返回', eyebrow:'中央題庫', newQuestion:'+ 新增題目', bilingualHint:'必須完成中英文兩個版本；數學公式可使用 LaTeX。', questionId:'Question ID', topic:'課題（以逗號分隔）', kind:'題型', stemEn:'題目（英文）', stemZh:'題目（中文）', choices:'選項', choicesHint:'2–6 個選項；請選出所有正確答案。', addChoice:'+ 新增選項', subparts:'短答小題', subpartsHint:'每個小題各自設定答案、解釋及整數分數。', addSubpart:'+ 新增小題', explanationEn:'解釋（英文）', explanationZh:'解釋（中文）', cancel:'取消', submitQuestion:'提交題目', questionList:'題目', refresh:'重新載入', emptyTitle:'暫時沒有題目', search:'搜尋 Question ID', all:'所有狀態', pending:'待審批', published:'已發布', rejected:'已拒絕', inactive:'已停用', allTypes:'所有題型', teacherDescription:'提交中英文題目，交由管理員審批；獲批准前，其他老師不會看到你的題目。', adminDescription:'建立及管理中央中英文題庫，並審核老師提交的題目。', listTeacher:'你提交的題目', listAdmin:'中央題庫及老師提交', emptyTeacher:'你尚未提交題目。按「新增題目」開始。', emptyAdmin:'中央題庫目前沒有題目。你可以在此新增題目，或審核老師提交。', loading:'載入中……', loadError:'未能載入題目；題庫服務可能尚未部署。', authError:'請返回 Mathcolate 首頁重新登入。', roleError:'此頁只供教師及管理員使用。', status_pending:'待審批', status_published:'已發布', status_rejected:'已拒絕', status_inactive:'已停用', review:'審核', edit:'編輯', approve:'批准並發布', return:'退回修改', reject:'拒絕', reason:'原因（選填）', confirm:'確認', noAnswer:'題目必須有標準答案才可發布。', missingChoice:'請加入至少 2 個選項，並選擇至少一個正確答案。', saved:'題目已提交。', actionFailed:'操作失敗；系統不會假設已成功，請再試。', codeRequired:'必須填寫 Question ID。', topicsRequired:'請至少填寫一個課題。', newTitle:'新增題目', editTitle:'編輯題目', requestTitle:'提交題目審批', adminCreate:'儲存為待審批', duplicate:'如 Question ID 重複，系統會在發布時執行唯一性檢查。' }
  };
  const t = k => (copy[lang] || copy.en)[k] || k;
  function applyLanguage() {
    document.documentElement.lang = lang === 'zh' ? 'zh-HK' : 'en';
    document.querySelectorAll('[data-i18n]').forEach(el => el.textContent = t(el.dataset.i18n));
    $('lang-toggle').textContent = lang === 'zh' ? 'ENG/中文' : '中文/ENG';
    $('search').placeholder = t('search');
    $('state-filter').options[0].textContent = t('all');
    $('state-filter').options[1].textContent = t('pending');
    $('state-filter').options[2].textContent = t('published');
    $('state-filter').options[3].textContent = t('rejected');
    $('state-filter').options[4].textContent = t('inactive');
    $('kind-filter').options[0].textContent = t('allTypes');
    if (profile) {
      $('page-title').textContent = t('eyebrow');
      $('page-description').textContent = isAdmin ? t('adminDescription') : t('teacherDescription');
      $('list-description').textContent = isAdmin ? t('listAdmin') : t('listTeacher');
      $('empty-description').textContent = isAdmin ? t('emptyAdmin') : t('emptyTeacher');
    }
  }
  function showNotice(message, error = false) {
    $('notice').textContent = message;
    $('notice').className = 'rounded-xl border p-4 text-sm ' + (error ? 'border-red-200 bg-red-50 text-red-800' : 'border-green-200 bg-green-50 text-green-800');
  }
  function hideEditor() { $('editor-card').classList.add('hidden'); $('question-form').reset(); $('question-uuid').value = ''; editing = false; }
  function addChoice(data = {}) {
    if (choiceCount >= 6) return;
    choiceCount++;
    const id = choiceCount;
    const row = document.createElement('div');
    row.className = 'grid gap-2 rounded-lg border border-gray-200 bg-white p-3 md:grid-cols-[auto_1fr_1fr_auto]';
    row.dataset.choice = String(id);
    row.innerHTML = '<label class="flex items-center gap-2 text-xs font-semibold"><input type="checkbox" class="correct-answer h-4 w-4 accent-[#6f4822]">Correct</label><input class="choice-en rounded-lg border border-gray-300 px-3 py-2 text-sm" required placeholder="English option"><input class="choice-zh rounded-lg border border-gray-300 px-3 py-2 text-sm" required placeholder="中文選項"><button type="button" class="remove-choice rounded-lg px-2 text-gray-500 hover:bg-red-50 hover:text-red-600" aria-label="Remove">✕</button>';
    row.querySelector('.correct-answer').checked = !!data.correct;
    row.querySelector('.choice-en').value = data.en || '';
    row.querySelector('.choice-zh').value = data.zh || '';
    row.querySelector('.remove-choice').onclick = () => { row.remove(); updateChoiceButtons(); };
    $('choices-list').append(row); updateChoiceButtons();
  }
  function updateChoiceButtons() { $('add-choice').disabled = $('choices-list').children.length >= 6; $('add-choice').classList.toggle('opacity-40', $('add-choice').disabled); }
  function addPart(data = {}) {
    partCount++;
    const row = document.createElement('div'); row.className = 'grid gap-2 rounded-lg border border-gray-200 bg-white p-3 md:grid-cols-6';
    row.innerHTML = '<label class="text-xs font-semibold md:col-span-1">Part<input class="part-key mt-1 w-full rounded border px-2 py-2" required value="' + String(data.key || '(' + partCount + ')').replace(/&/g,'&amp;').replace(/"/g,'&quot;') + '"></label><label class="text-xs font-semibold md:col-span-1">Marks<input type="number" min="1" step="1" class="part-marks mt-1 w-full rounded border px-2 py-2" required value="' + Number(data.marks || 1) + '"></label><label class="text-xs font-semibold md:col-span-2">Answer EN<input class="part-answer-en mt-1 w-full rounded border px-2 py-2" required></label><label class="text-xs font-semibold md:col-span-2">Answer 中文<input class="part-answer-zh mt-1 w-full rounded border px-2 py-2" required></label><label class="text-xs font-semibold md:col-span-3">Explanation EN<textarea class="part-exp-en mt-1 w-full rounded border px-2 py-2" required rows="2"></textarea></label><label class="text-xs font-semibold md:col-span-3">Explanation 中文<textarea class="part-exp-zh mt-1 w-full rounded border px-2 py-2" required rows="2"></textarea></label><label class="flex items-center gap-2 text-xs md:col-span-2"><input type="checkbox" class="part-unit">Require unit</label><button type="button" class="remove-part justify-self-start text-xs font-semibold text-red-600">Remove part</button>';
    row.querySelector('.part-answer-en').value = data.answer_en || ''; row.querySelector('.part-answer-zh').value = data.answer_zh || '';
    row.querySelector('.part-exp-en').value = data.explanation_en || ''; row.querySelector('.part-exp-zh').value = data.explanation_zh || ''; row.querySelector('.part-unit').checked = !!data.unit_required;
    row.querySelector('.remove-part').onclick = () => row.remove(); $('subparts-list').append(row);
  }
  function setKind() { const mc = $('question-kind').value === 'MC'; $('mc-fields').classList.toggle('hidden', !mc); $('sq-fields').classList.toggle('hidden', mc); }
  function openEditor(row = null) {
    editing = !!row; $('question-form').reset(); $('choices-list').replaceChildren(); $('subparts-list').replaceChildren(); choiceCount = 0; partCount = 0;
    $('question-uuid').value = row?.id || ''; $('question-code').value = row?.question_code || ''; $('question-topics').value = (row?.topics || []).join(', ');
    $('question-kind').value = row?.kind || 'MC'; $('stem-en').value = row?.stem?.en || ''; $('stem-zh').value = row?.stem?.zh || '';
    $('explanation-en').value = row?.explanation?.en || ''; $('explanation-zh').value = row?.explanation?.zh || '';
    (row?.choices?.length ? row.choices : [{},{},]).forEach(c => addChoice({en:c.en,zh:c.zh,correct:(row?.answer?.correct_choice_ids || []).includes(c.id)}));
    (row?.subparts || []).forEach(addPart);
    if (!row && $('question-kind').value === 'SQ') addPart();
    setKind(); $('editor-title').textContent = isAdmin ? (row ? t('editTitle') : t('newTitle')) : t('requestTitle');
    $('save-question').textContent = isAdmin ? t('adminCreate') : t('submitQuestion');
    $('editor-card').classList.remove('hidden'); $('editor-card').scrollIntoView({behavior:'smooth',block:'start'});
  }
  function collectPayload() {
    const code = $('question-code').value.trim(), topics = $('question-topics').value.split(',').map(x=>x.trim()).filter(Boolean);
    if (!code) throw new Error(t('codeRequired')); if (!topics.length) throw new Error(t('topicsRequired'));
    const kind = $('question-kind').value, choices = [...$('choices-list').children].map((row,i)=>({id:'option-'+(i+1),en:row.querySelector('.choice-en').value.trim(),zh:row.querySelector('.choice-zh').value.trim(),correct:row.querySelector('.correct-answer').checked}));
    const subparts = [...$('subparts-list').children].map(row=>({key:row.querySelector('.part-key').value.trim(),marks:Number(row.querySelector('.part-marks').value),answer_en:row.querySelector('.part-answer-en').value.trim(),answer_zh:row.querySelector('.part-answer-zh').value.trim(),explanation_en:row.querySelector('.part-exp-en').value.trim(),explanation_zh:row.querySelector('.part-exp-zh').value.trim(),unit_required:row.querySelector('.part-unit').checked}));
    if (kind === 'MC' && (choices.length < 2 || choices.length > 6 || !choices.some(c=>c.correct))) throw new Error(t('missingChoice'));
    if (kind === 'SQ' && (!subparts.length || subparts.some(p=>!p.key || !Number.isInteger(p.marks) || p.marks < 1 || !p.answer_en || !p.answer_zh))) throw new Error(t('noAnswer'));
    return {id:$('question-uuid').value || null, question_code:code, topics, kind, stem:{en:$('stem-en').value.trim(),zh:$('stem-zh').value.trim()}, choices:kind==='MC'?choices:[], subparts:kind==='SQ'?subparts:[], explanation:{en:$('explanation-en').value.trim(),zh:$('explanation-zh').value.trim()}};
  }
  async function rpc(name,args={}) {
    if (!db) throw new Error('Supabase client unavailable');
    const {data,error}=await db.rpc(name,args); if(error) throw error; return data;
  }
  async function loadQuestions() {
    $('loading').textContent=t('loading'); $('loading').classList.remove('hidden'); $('empty').classList.add('hidden'); $('question-list').replaceChildren();
    try {
      const state=$('state-filter').value, kind=$('kind-filter').value, search=$('search').value.trim();
      const data=await rpc(isAdmin?'mc_question_bank_admin_list':'mc_question_bank_teacher_list',{p_state:state,p_kind:kind,p_query:search});
      rows=Array.isArray(data)?data:(data?.questions||[]);
      $('loading').classList.add('hidden');
      if (!rows.length) $('empty').classList.remove('hidden');
      rows.forEach(row => $('question-list').append(renderRow(row)));
    } catch (e) {
      $('loading').textContent=t('loadError'); $('loading').classList.remove('hidden');
      console.error('Question Bank load failed',e);
    }
  }
  function renderRow(row) {
    const card=document.createElement('article'); card.className='rounded-xl border border-gray-200 p-4 hover:border-[#d9c4b8]';
    const state=String(row.state||'pending');
    const title=(row.stem?.[lang]||row.stem?.en||row.question_code||'').toString();
    const badge=state==='published'?'bg-green-50 text-green-700':state==='rejected'?'bg-red-50 text-red-700':state==='inactive'?'bg-gray-100 text-gray-600':'bg-amber-50 text-amber-800';
    const heading=document.createElement('div'); heading.className='flex flex-col gap-3 sm:flex-row sm:items-start sm:justify-between';
    const left=document.createElement('div'); left.innerHTML='<div class="flex flex-wrap items-center gap-2"><span class="font-mono text-sm font-bold text-[#6f4822]"></span><span class="rounded-full px-2.5 py-1 text-xs font-semibold '+badge+'"></span><span class="rounded-full bg-gray-100 px-2.5 py-1 text-xs font-semibold text-gray-600"></span></div><p class="mt-2 font-semibold text-gray-900"></p><p class="mt-1 text-xs text-gray-500"></p>';
    left.children[0].children[0].textContent=row.question_code||'—'; left.children[0].children[1].textContent=t('status_'+state); left.children[0].children[2].textContent=row.kind||'';
    left.children[1].textContent=title; left.children[2].textContent=(row.topics||[]).join(' · ');
    const actions=document.createElement('div'); actions.className='flex flex-wrap gap-2';
    if(isAdmin && state==='pending') {
      [['approve','approve'],['return','return'],['reject','reject']].forEach(([label,action])=>{const b=document.createElement('button');b.className='rounded-lg border border-gray-300 px-3 py-2 text-xs font-bold hover:bg-gray-50';b.textContent=t(label);b.onclick=()=>moderate(row,action);actions.append(b);});
    }
    if(isAdmin || state!=='published') {const b=document.createElement('button');b.className='rounded-lg border border-gray-300 px-3 py-2 text-xs font-bold hover:bg-gray-50';b.textContent=t('edit');b.onclick=()=>openEditor(row);actions.append(b);}
    heading.append(left,actions); card.append(heading);
    if (row.review_note) {const note=document.createElement('p');note.className='mt-3 rounded-lg bg-gray-50 p-3 text-sm text-gray-600';note.textContent=row.review_note;card.append(note);}
    return card;
  }
  async function moderate(row, action) {
    const reason=action==='approve'?'':window.prompt(t('reason') || 'Optional reason')||'';
    if (action!=='approve' && reason===null) return;
    if (!window.confirm(t(action)+'?')) return;
    try { await rpc('mc_question_bank_admin_moderate',{p_question_id:row.id,p_action:action,p_reason:reason}); showNotice(t('saved')); await loadQuestions(); }
    catch(e) { console.error(e); showNotice(t('actionFailed'),true); }
  }
  $('question-kind').addEventListener('change',setKind);
  $('add-choice').addEventListener('click',()=>addChoice());
  $('add-subpart').addEventListener('click',()=>addPart());
  $('new-question').addEventListener('click',()=>openEditor());
  $('close-editor').addEventListener('click',hideEditor); $('cancel-editor').addEventListener('click',hideEditor);
  $('refresh').addEventListener('click',loadQuestions); $('state-filter').addEventListener('change',loadQuestions); $('kind-filter').addEventListener('change',loadQuestions);
  let searchTimer; $('search').addEventListener('input',()=>{clearTimeout(searchTimer);searchTimer=setTimeout(loadQuestions,250);});
  $('question-form').addEventListener('submit',async e=>{
    e.preventDefault(); const button=$('save-question'); button.disabled=true;
    try {
      const payload=collectPayload();
      await rpc(isAdmin?'mc_question_bank_admin_save':'mc_question_bank_teacher_submit',{p_question:payload});
      showNotice(t('saved')); hideEditor(); await loadQuestions();
    } catch(err) { showNotice(err.message || t('actionFailed'),true); }
    finally { button.disabled=false; }
  });
  $('lang-toggle').addEventListener('click',()=>{lang=lang==='en'?'zh':'en';try{localStorage.setItem('mathcolate_language',lang);}catch(_){} applyLanguage();loadQuestions();});
  async function init() {
    applyLanguage();
    if (!db || SUPABASE_ANON_KEY.startsWith('REPLACE_')) { $('loading').textContent='Question Bank setup is incomplete: configure the existing public Supabase key and deploy the reviewed Question Bank RPC migration before enabling this page.'; $('loading').classList.remove('hidden'); return; }
    try {
      const {data:{session}}=await db.auth.getSession();
      if(!session){showNotice(t('authError'),true);$('loading').classList.add('hidden');return;}
      const {data,error}=await db.from('users_acc_info').select('id,username,eng_name,chi_name,role').eq('id',session.user.id).maybeSingle();
      if(error||!data) throw error||new Error('Profile missing');
      profile=data; isAdmin=String(data.role).toLowerCase()==='admin';
      if(!isAdmin && String(data.role).toLowerCase()!=='teacher'){showNotice(t('roleError'),true);$('loading').classList.add('hidden');return;}
      $('user-label').textContent=data.chi_name||data.eng_name||data.username||'';
      $('new-question').classList.remove('hidden'); applyLanguage(); await loadQuestions();
    } catch(e) { console.error(e);showNotice(t('authError'),true);$('loading').classList.add('hidden'); }
  }
  init();
})();
</script>
</body></html>
